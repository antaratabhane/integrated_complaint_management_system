<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Public Complaint Portal</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --green-main:#1F6F78;
      --green-soft:#2FA4A9;
      --green-light:#E6F2F3;
      --bg-light:#F3FBFA;
      --card:#ffffff;
      --dark:#1E2D2F;
      --muted:#7D8F91;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #E6F2F3, #F3FBFA);
      font-family: "Inter","Segoe UI",Tahoma,sans-serif;
      color: var(--dark);
    }

    h2 {
      font-weight: 700;
      color: var(--green-main);
    }

    /* Cards */
    .card {
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      border: none;
      box-shadow: 0 20px 40px rgba(31,111,120,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 28px 60px rgba(31,111,120,0.25);
    }

    .card-header {
      background: linear-gradient(90deg, var(--green-main), var(--green-soft));
      color: white;
      border-radius: 18px 18px 0 0;
      font-weight: 600;
      padding: 14px 20px;
    }

    /* Form */
    .form-label {
      font-weight: 600;
      color: var(--dark);
    }

    .form-control, .form-select {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #d1d5db;
      transition: 0.2s;
    }

    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(31,111,120,0.2);
    }

    /* Buttons */
    .btn-primary {
      border-radius: 12px;
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--green-main), var(--green-soft));
      border: none;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(31,111,120,0.35);
      transition: 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(31,111,120,0.45);
      background: linear-gradient(135deg, #13474D, var(--green-main));
    }

    /* Table */
    .table {
      border-radius: 12px;
      overflow: hidden;
    }

    .table-dark {
      background: linear-gradient(90deg, var(--green-main), var(--green-soft));
      color: white;
    }

    .table tbody tr {
      transition: background 0.2s;
    }

    .table tbody tr:hover {
      background: var(--green-light);
    }

    /* Layout */
    .container {
      max-width: 900px;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <h2 class="text-center mb-4">Public Complaint Portal</h2>

  <!-- First Area: New Complaint -->
  <div class="card mb-4 shadow">
    <div class="card-header fw-bold">
      Create New Complaint
    </div>
    <div class="card-body">
      <form method="post" action="/complaint">
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" name="catagory">
            <option selected disabled>Select category</option>
            <option value="electricity">Electricity</option>
            <option value="water">Water</option>
            <option value="garbage">Garbage</option>
            <option value="sewage">Sewage</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Problem Description</label>
          <input class="form-control" type="text" placeholder="Describe your problem..." name="description">
        </div>

        <button class="btn btn-primary" type="submit">
          Submit Complaint
        </button>
        <a href="/upload_image" class="ms-3">Upload Image</a>
      </form>
    </div>
  </div>

  <!-- Second Area: Complaint Status -->
  <div class="card shadow">
    <div class="card-header fw-bold">
      My Complaints
    </div>
    <div class="card-body">
      <table class="table table-bordered text-center">
        <thead class="table-dark">
          <tr>
            <th>Category</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="complaints"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
fetch("/get_complaint")
  .then(res => res.json())
  .then(data => {
    let tbody = document.getElementById("complaints");

    data.forEach(c => {
      let tr = document.createElement("tr");

      let tdCat = document.createElement("td");
      tdCat.innerText = c.catagory;

      let tdDesc = document.createElement("td");
      tdDesc.innerText = c.description;

      tr.appendChild(tdCat);
      tr.appendChild(tdDesc);
      tbody.appendChild(tr);
    });
  });
</script>

</body>
</html>
