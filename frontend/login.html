<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary:#1F6F78;
      --primary-dark:#13474D;
      --primary-light:#E6F2F3;
      --accent:#8ED1C6;
      --white:#ffffff;
      --gray:#7D8F91;
      --dark:#1E2D2F;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#1F6F78,#2FA4A9,#8ED1C6);
      font-family: "Inter","Segoe UI",Tahoma,sans-serif;
    }

    /* Glass Card */
    .card-custom {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
      animation: fadeIn 0.6s ease;
      border: none;
    }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(20px); }
      to { opacity:1; transform:translateY(0); }
    }

    h2 {
      color: var(--primary-dark);
      font-weight: 600;
    }

    /* Inputs */
    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #d1d5db;
      transition: 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31,111,120,0.15);
    }

    /* Button */
    .btn-primary {
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(135deg,#1F6F78,#2FA4A9);
      border: none;
      font-weight: 600;
      box-shadow: 0 12px 25px rgba(31,111,120,0.35);
      transition: 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(31,111,120,0.45);
      background: linear-gradient(135deg,#13474D,#1F6F78);
    }

    /* Footer Link */
    p {
      color: var(--gray);
    }

    p a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card-custom p-4 w-100" style="max-width: 420px;">
    
    <h2 class="text-center mb-4">Login</h2>

    <form method="post" action="/login">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Username" name="username">
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Password" name="password">
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-center mt-3 mb-0">
      Don't have an account?
      <a href="/register">Register</a>
    </p>

  </div>
</div>

</body>
</html>
